<!doctype html>
<html lang="ja">
<head>

  <title>MIND SEEKER — ワールドマップ</title>
  <style>
    :root { color: #2c241b; font-family: ui-rounded, "Hiragino Maru Gothic ProN", system-ui, sans-serif; background:#17243a; }
    * { box-sizing:border-box; } body { margin:0; min-height:100vh; background:radial-gradient(circle at 50% -20%,#405a81,#17243a 57%); }
    header { height:64px; padding:0 28px; display:flex; align-items:center; justify-content:space-between; color:#f5e6bf; }
    .brand { font-family:Georgia,serif; font-weight:700; letter-spacing:.15em; } .brand small{display:block;font:600 10px system-ui;letter-spacing:.24em;color:#d9c78f}
    .tools { display:flex; gap:8px; } .tools button { border:1px solid #d9c78f88; background:#243654; color:#f5e6bf; padding:9px 12px;border-radius:9px; }
    main { min-height:calc(100vh - 64px); padding:0 24px 24px; }
    .map { position:relative; overflow:hidden; min-height:720px; border:2px solid #dfc58b; border-radius:24px; background:#283e48; box-shadow:0 18px 46px #0c1424aa; }
    svg { width:100%; height:100%; position:absolute; inset:0; } .sheet { position:absolute; top:28px; right:28px; width:330px; padding:24px; background:#f5e6bf; border:2px solid #c5984e; border-radius:18px; box-shadow:0 12px 24px #24365466; }
    .eyebrow { color:#7a5a2e; letter-spacing:.12em; font-size:11px; font-weight:700; }.sheet h1 { margin:5px 0 11px; font:700 26px Georgia,serif; }.sheet p { font-size:14px; line-height:1.7; }.progress { margin:18px 0; height:8px; border-radius:99px; background:#ddca98; overflow:hidden; }.progress span{display:block;width:0%;height:100%;background:#5d966b}.sheet button { border:0; width:100%; border-radius:10px; padding:13px;background:#a56a31;color:white;font-weight:700; }
    .legend { position:absolute; bottom:22px; left:24px; display:flex; gap:12px; padding:10px 14px; border-radius:12px;background:#f5e6bfdd;font-size:12px}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.gold{background:#e9b44c}.green{background:#5d966b}.gray{background:#8a826f}
    @media(max-width:600px) { header{height:56px;padding:0 14px}.tools button:last-child{display:none}main{padding:0 0 16px}.map{border-radius:0;min-height:760px;border-width:1px}.sheet{top:auto;bottom:12px;left:12px;right:12px;width:auto;padding:17px}.sheet h1{font-size:21px}.legend{bottom:205px;left:12px;font-size:11px} }
  </style>
</head>
